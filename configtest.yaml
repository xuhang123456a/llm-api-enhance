# 测试夹具：internal/app/app_test.go 与 internal/router 的测试依赖本文件。
#
# 上游仓库缺失该文件，导致 `go test ./...` 在 app / router 两个包上失败。
# 这里按测试断言补全：监听 127.0.0.1:28080、访问密钥 real-upstream-access、
# 启用 realopenai 渠道并开启隐私保护，base_url 由环境变量注入。

server:
  listen_address: 127.0.0.1
  listen_port: 28080
  read_timeout: 15s
  write_timeout: 60s
  idle_timeout: 60s
  max_idle_client_num: 100

security:
  access_key: real-upstream-access

runtime:
  default_timeout: 30s

log:
  enable: false
  level: info
  retention_days: 1

llm_private_protect_config:
  model: ${REAL_UPSTREAM_MODEL}
  base_url: ${REAL_UPSTREAM_BASE_URL}
  api_key: ${REAL_UPSTREAM_API_KEY}
  temperature: 0.0
  redis: ""

channels:
  realopenai:
    enabled: true
    llm_private_protect_enable: true
    upstream:
      base_url: ${REAL_UPSTREAM_BASE_URL}
      format: openai
    channel_policy:
      timeout: 30s
      request_body:
        model_rewrite:
          ${REAL_UPSTREAM_MODEL}: ${REAL_UPSTREAM_MODEL}
    model_rules: []
